<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Practice EPSO exam questions: classic, learning and timed exam modes, with a searchable question list." />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>EPSO Practice</title>
    <script>
      // Apply the saved theme before the first paint, to avoid a light flash in dark mode.
      try {
        var t = (JSON.parse(localStorage.getItem('epso-quiz:settings') || '{}') || {}).theme;
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
